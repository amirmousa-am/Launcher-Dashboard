<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Tools — Admin</title>
<style>
:root{
  --bg:#0b1120;
  --bg-soft:#111827;
  --card:#151d2e;
  --card-2:#1a2436;
  --input:#0f172a;
  --line:#263247;
  --line-soft:#1f2a3d;
  --ink:#e5edf7;
  --muted:#8b9ab0;
  --muted-2:#64748b;
  --accent:#38bdf8;
  --accent-dark:#0ea5e9;
  --accent-soft:rgba(56,189,248,.12);
  --good:#2dd4bf;
  --good-soft:rgba(45,212,191,.11);
  --bad:#fb7185;
  --bad-soft:rgba(251,113,133,.10);
  --shadow:0 12px 32px rgba(0,0,0,.22);
}

*{box-sizing:border-box}

html{background:var(--bg)}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -10%,rgba(56,189,248,.055),transparent 34%),
    var(--bg);
  color:var(--ink);
  font:14px 'Segoe UI',system-ui,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(11,17,32,.92);
  border-bottom:1px solid var(--line-soft);
  color:#fff;
  padding:15px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  backdrop-filter:blur(14px);
  box-shadow:0 8px 24px rgba(0,0,0,.16);
}

header h1{
  font-size:16px;
  line-height:1.2;
  margin:0;
  letter-spacing:-.01em;
}

header .sub{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}

main{
  max-width:1080px;
  margin:0 auto;
  padding:24px 20px 64px;
}

.card{
  background:linear-gradient(180deg,rgba(26,36,54,.96),rgba(21,29,46,.96));
  border:1px solid var(--line);
  border-radius:14px;
  padding:19px 20px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
}

.card h2{
  font-size:11px;
  color:#b8c5d8;
  margin:0 0 14px;
  text-transform:uppercase;
  letter-spacing:.09em;
  font-weight:700;
}

button{
  font:inherit;
  font-size:12px;
  font-weight:650;
  cursor:pointer;
  border-radius:8px;
  border:1px solid var(--line);
  background:#182235;
  color:#dbe7f5;
  padding:8px 12px;
  transition:background .15s,border-color .15s,transform .1s,box-shadow .15s;
}

button:hover{
  background:#202c41;
  border-color:#35445d;
}

button:active{transform:translateY(1px)}

button:disabled{
  opacity:.45;
  cursor:default;
  transform:none;
}

button:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

button.primary{
  background:var(--accent-dark);
  border-color:var(--accent-dark);
  color:#fff;
  box-shadow:0 4px 14px rgba(14,165,233,.18);
}

button.primary:hover{
  background:#0284c7;
  border-color:#0284c7;
}

.hbtn{
  background:rgba(255,255,255,.035);
  border-color:#334155;
  color:#d8e2ef;
}

.hbtn:hover{
  background:rgba(255,255,255,.08);
  border-color:#475569;
}

input,select{
  font:inherit;
  color:var(--ink);
  padding:9px 11px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--input);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.12);
}

input::placeholder{color:#64748b}

select{
  color:#dbe7f5;
  min-height:36px;
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}

.row input{
  flex:1;
  min-width:170px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:12px;
  margin-bottom:16px;
}

.stat{
  position:relative;
  overflow:hidden;
  background:linear-gradient(180deg,#172238,#141d2e);
  border:1px solid var(--line);
  border-radius:13px;
  padding:15px 17px;
  box-shadow:0 8px 24px rgba(0,0,0,.16);
}

.stat:after{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:3px;
  height:100%;
  background:rgba(56,189,248,.65);
}

.stat b{
  display:block;
  font-size:22px;
  line-height:1.1;
  color:#f1f6fc;
  letter-spacing:-.02em;
}

.stat span{
  display:block;
  margin-top:6px;
  font-size:10px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.08em;
}

.note{
  font-size:11px;
  color:var(--muted);
  margin:11px 0 0;
  line-height:1.55;
}

.u{
  border:1px solid var(--line);
  border-radius:11px;
  padding:14px 15px;
  margin-top:12px;
  background:rgba(15,23,42,.38);
  transition:border-color .15s,background .15s;
}

.u:hover{
  border-color:#33445e;
  background:rgba(20,31,49,.72);
}

.u.dis{
  background:rgba(15,23,42,.22);
  border-color:#202c3e;
}

.u.dis .email{color:#a7b3c5}

.uh{
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:11px;
}

.email{
  font-weight:700;
  color:#e7eef8;
  font-size:13px;
}

.name{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.acts{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  align-items:center;
}

.meta{
  font-size:10px;
  color:var(--muted-2);
  margin-right:3px;
}

.acts button{padding:6px 9px}

.pill.active{
  background:var(--good-soft);
  color:#5eead4;
  border-color:rgba(45,212,191,.28);
}

.pill.inactive{
  background:var(--bad-soft);
  color:#fda4af;
  border-color:rgba(251,113,133,.24);
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding-top:2px;
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 9px;
  border-radius:7px;
  font:600 10px Consolas,monospace;
  color:#91a0b4;
  background:#111a2a;
  border:1px solid #253149;
}

.chip:hover{
  border-color:#3a4a64;
  background:#182337;
}

.chip.on{
  background:var(--accent-soft);
  border-color:rgba(56,189,248,.38);
  color:#7dd3fc;
}

.chip .dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#475569;
  box-shadow:0 0 0 2px rgba(71,85,105,.12);
}

.chip.on .dot{
  background:var(--accent);
  box-shadow:0 0 0 2px rgba(56,189,248,.13);
}

/* Globally disabled tools: visually subdued, but never struck through. */
span.chip.off{
  border:1px dashed #334155;
  background:#101827;
  color:#66758b;
  opacity:.62;
  text-decoration:none;
  cursor:not-allowed;
}

span.chip.off:hover{
  background:#101827;
  border-color:#334155;
}

.empty{
  color:var(--muted);
  font-size:12px;
  padding:24px 0;
  text-align:center;
}

#loginScreen{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 50% 35%,rgba(56,189,248,.09),transparent 32%),
    #080e1b;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
}

#loginScreen .box{
  background:linear-gradient(180deg,#172238,#121b2b);
  border:1px solid var(--line);
  box-shadow:0 24px 70px rgba(0,0,0,.45);
  padding:28px 30px;
  border-radius:14px;
  width:300px;
}

#loginScreen h2{
  font-size:14px;
  margin:0 0 16px;
  color:#f1f5f9;
}

#loginScreen input{
  width:100%;
  margin-bottom:10px;
}

#loginScreen button{width:100%}

#loginError{
  color:#fda4af;
  font-size:11px;
  margin-top:7px;
  min-height:14px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(2,6,23,.72);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:900;
  backdrop-filter:blur(4px);
}

.modal[hidden]{display:none}

.modal .box{
  background:linear-gradient(180deg,#182337,#131c2c);
  border:1px solid var(--line);
  box-shadow:0 24px 70px rgba(0,0,0,.45);
  border-radius:14px;
  padding:20px 22px;
  max-width:380px;
  width:90%;
}

.modal p{
  margin:0 0 17px;
  line-height:1.55;
  color:#d9e3ef;
}

.modal .row{justify-content:flex-end}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:999;
  background:#0f766e;
  color:#ecfeff;
  padding:10px 15px;
  border:1px solid rgba(94,234,212,.2);
  border-radius:9px;
  font-size:11px;
  font-weight:650;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
  opacity:0;
  transform:translateY(5px);
  transition:opacity .2s,transform .2s;
  pointer-events:none;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

.toast.error{
  background:#9f1239;
  border-color:rgba(251,113,133,.25);
}

@media(max-width:700px){
  header{padding:13px 16px}
  header .sub{display:none}
  main{padding:16px 12px 50px}
  .card{padding:16px}
  .uh{align-items:flex-start}
  .acts{width:100%}
  .meta{width:100%;margin-bottom:2px}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="box">
    <h2>Admin Access</h2>
    <input type="password" id="loginPassword" placeholder="Password" autofocus>
    <button class="primary" id="loginBtn">Enter</button>
    <div id="loginError"></div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="box" role="dialog" aria-modal="true">
    <p id="mMsg"></p>
    <div class="row"><button id="mNo">Cancel</button><button class="primary" id="mOk">OK</button></div>
  </div>
</div>

<header>
  <div>
    <h1>Atlas Productivity — Admin</h1>
    <div class="sub">Manage employee access to internal tools</div>
  </div>
  <div class="row">
    <button class="hbtn" id="refreshBtn">↺ Refresh</button>
    <button class="hbtn" id="logoutBtn">Log Out</button>
  </div>
</header>

<main>
  <div class="stats" id="stats"></div>

  <div class="card">
    <h2>Add / Update User</h2>
    <div class="row">
      <input type="email" id="newEmail" placeholder="employee@almosafer.com">
      <input type="text" id="newName" placeholder="Full name">
      <button class="primary" id="addUserBtn">Add User</button>
    </div>
  </div>

  <div class="card">
    <h2>Users &amp; Tool Access</h2>
    <div class="row">
      <input type="search" id="q" placeholder="Search name or email…">
      <select id="flt"><option value="all">All users</option><option value="active">Active</option><option value="disabled">Disabled</option></select>
      <button id="recheckAll" title="Ask every user's launcher to recheck now">↻ Recheck all users</button>
    </div>
    <p class="note">Changes reach users at their next launcher check (up to 4 hours). Press <b>Recheck</b> to push them now — open Atlas tabs pick it up within about 10 minutes.</p>
    <div id="userList"><div class="empty">Loading…</div></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://vrhtmogozyumjtctzyzj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZyaHRtb2dvenl1bWp0Y3R6eXpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMjgxOTMsImV4cCI6MjA5OTYwNDE5M30.hVTMIDXB5bH1M4LkW0K-jMH2Kfe9sd7QH9pvvx-NaF0";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let STATE = { users: [], tools: [], userTools: [] };
let ADMIN_PASSWORD = null;
let sessionTimer = null;
const SESSION_LENGTH_MS = 10 * 60 * 1000; // 10 minutes

function resetSessionTimer(){
  if (sessionTimer) clearTimeout(sessionTimer);
  sessionTimer = setTimeout(logout, SESSION_LENGTH_MS);
}

function logout(){
  ADMIN_PASSWORD = null;
  if (sessionTimer) clearTimeout(sessionTimer);
  $('loginPassword').value = '';
  $('loginError').textContent = '';
  $('loginScreen').style.display = 'flex';
}

$('logoutBtn').addEventListener('click', logout);
$('refreshBtn').addEventListener('click', () => {
  if (!ADMIN_PASSWORD) { toast('Session expired — please log in again', true); return; }
  resetSessionTimer();
  loadAll();
  toast('Refreshed');
});

// Any interaction while logged in extends the session
['click', 'keydown'].forEach(ev => document.addEventListener(ev, () => {
  if (ADMIN_PASSWORD) resetSessionTimer();
}));

function toast(msg, isError = false){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2600);
}

function ask(msg, okLabel){
  return new Promise(res => {
    const m = $('modal');
    $('mMsg').textContent = msg;
    $('mOk').textContent = okLabel;
    m.hidden = false;
    $('mOk').focus();
    const done = v => { m.hidden = true; res(v); };
    $('mOk').onclick = () => done(true);
    $('mNo').onclick = () => done(false);
    m.onkeydown = e => { if (e.key === 'Escape') done(false); };
  });
}

async function callAdmin(payload){
  const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-panel`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
    },
    body: JSON.stringify({ ...payload, password: ADMIN_PASSWORD })
  });
  if (res.status === 401) {
    if ($('loginScreen').style.display === 'none') { logout(); toast('Session ended — please log in again', true); }
    throw new Error('Unauthorized');
  }
  if (!res.ok) throw new Error(`Server error ${res.status}`);
  return res.json();
}

function ago(ts){
  const s = (Date.now() - new Date(ts).getTime()) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  return Math.floor(s / 86400) + ' d ago';
}

function isEnabled(email, tool_key){
  const row = STATE.userTools.find(u => u.email === email && u.tool_key === tool_key);
  return !!(row && row.enabled);
}

function setLocal(email, key, val){
  const r = STATE.userTools.find(x => x.email === email && x.tool_key === key);
  if (r) r.enabled = val; else STATE.userTools.push({ email, tool_key: key, enabled: val });
}

function card(u, live){
  const e = esc(u.email);
  const n = live.filter(t => isEnabled(u.email, t.tool_key)).length;
  const chips = STATE.tools.map(t => {
    const k = esc(t.tool_key);
    if (t.is_enabled === false) return `<span class="chip off" title="Tool disabled globally">${k}</span>`;
    const o = isEnabled(u.email, t.tool_key);
    return `<button class="chip ${o ? 'on' : ''}" data-act="tool" data-email="${e}" data-tool="${k}" aria-pressed="${o}" title="${esc(t.description || '')}"><span class="dot"></span>${k}</button>`;
  }).join('');
  return `
    <div class="u ${u.active ? '' : 'dis'}">
      <div class="uh">
        <div><div class="email">${e}</div><div class="name">${esc(u.full_name || '')}</div></div>
        <div class="acts">
          <span class="meta">${n}/${live.length} tools · ${u.force_recheck_at ? 'recheck asked ' + ago(u.force_recheck_at) : 'no recheck yet'}</span>
          <button data-act="all-on" data-email="${e}">All on</button>
          <button data-act="all-off" data-email="${e}">All off</button>
          <button data-act="recheck" data-email="${e}" title="Ask this user's launcher to recheck now">↻ Recheck</button>
          <button class="pill ${u.active ? 'active' : 'inactive'}" data-act="active" data-email="${e}" aria-pressed="${!!u.active}">${u.active ? '● Active' : '● Disabled'}</button>
        </div>
      </div>
      <div class="chips">${chips}</div>
    </div>`;
}

function render(){
  const q = $('q').value.trim().toLowerCase(), f = $('flt').value;
  const live = STATE.tools.filter(t => t.is_enabled !== false);
  const list = STATE.users.filter(u =>
    (f === 'all' || (f === 'active') === !!u.active) &&
    (!q || (u.email + ' ' + (u.full_name || '')).toLowerCase().includes(q)));
  const act = STATE.users.filter(u => u.active).length;
  $('stats').innerHTML = [[STATE.users.length, 'Users'], [act, 'Active'], [STATE.users.length - act, 'Disabled'], [`${live.length} / ${STATE.tools.length}`, 'Tools live']]
    .map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
  $('userList').innerHTML = list.length
    ? list.map(u => card(u, live)).join('')
    : `<div class="empty">${STATE.users.length ? 'No users match.' : 'No users yet — add one above.'}</div>`;
}

async function setTool(email, key, val){
  const prev = isEnabled(email, key);
  setLocal(email, key, val); render();
  try {
    await callAdmin({ action: 'toggle_tool', email, tool_key: key, enabled: val });
    toast(`${key} ${val ? 'enabled' : 'disabled'} for ${email}`);
  } catch (e) {
    setLocal(email, key, prev); render();
    toast('Failed to update — reverted', true);
  }
}

async function setAll(email, val){
  const keys = STATE.tools.filter(t => t.is_enabled !== false && isEnabled(email, t.tool_key) !== val).map(t => t.tool_key);
  if (!keys.length) { toast('Nothing to change'); return; }
  const res = await Promise.allSettled(keys.map(k =>
    callAdmin({ action: 'toggle_tool', email, tool_key: k, enabled: val }).then(() => setLocal(email, k, val))));
  render();
  const bad = res.filter(r => r.status === 'rejected').length;
  toast(bad ? `${bad} failed — refresh to check` : `${keys.length} tools ${val ? 'enabled' : 'disabled'} for ${email}`, !!bad);
}

function stamp(r, email){
  STATE.users.forEach(u => { if (!email || u.email === email) u.force_recheck_at = r.force_recheck_at; });
}

async function recheck(email){
  try {
    stamp(await callAdmin({ action: 'force_recheck', email }), email);
    render();
    toast(`Recheck requested for ${email}`);
  } catch (e) {
    toast('Recheck failed — is the admin-panel update deployed?', true);
  }
}

$('recheckAll').addEventListener('click', async () => {
  if (!await ask("Ask every user's launcher to recheck now? Open Atlas tabs pick it up within about 10 minutes.", 'Recheck all')) return;
  try {
    const r = await callAdmin({ action: 'force_recheck', all: true });
    stamp(r); render();
    toast(`Recheck requested for ${r.count ?? 'all'} users`);
  } catch (e) {
    toast('Recheck failed — is the admin-panel update deployed?', true);
  }
});

$('userList').addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]');
  if (!b) return;
  const { act, email, tool } = b.dataset;
  if (act === 'tool') return setTool(email, tool, !isEnabled(email, tool));
  if (act === 'all-on' || act === 'all-off') return setAll(email, act === 'all-on');
  if (act === 'recheck') return recheck(email);
  if (act === 'active') {
    const u = STATE.users.find(x => x.email === email), next = !u.active;
    if (!next && !await ask(`Disable ${email}? They keep their tools until their next launcher check unless you also press Recheck.`, 'Disable')) return;
    try {
      await callAdmin({ action: 'set_user_active', email, active: next });
      u.active = next; render();
      toast(`${email} ${next ? 'activated' : 'disabled'}`);
    } catch (e) {
      toast('Failed to update status', true);
    }
  }
});

$('q').addEventListener('input', render);
$('flt').addEventListener('change', render);

async function loadAll(){
  try {
    const data = await callAdmin({ action: 'list' });
    STATE.users = data.users || [];
    STATE.tools = data.tools || [];
    STATE.userTools = data.userTools || [];
    render();
  } catch (e) {
    $('userList').innerHTML = `<div class="empty">Failed to load: ${esc(e.message)} <button onclick="loadAll()">Retry</button></div>`;
  }
}

async function addUser(){
  const email = $('newEmail').value.trim().toLowerCase();
  const full_name = $('newName').value.trim();
  if (!full_name) { toast('Full name is required', true); return; }
  if (!email.endsWith('@almosafer.com')) { toast('Must be an @almosafer.com email', true); return; }
  $('addUserBtn').disabled = true;
  try {
    await callAdmin({ action: 'add_user', email, full_name });
    $('newEmail').value = '';
    $('newName').value = '';
    toast(`Added ${email}`);
    loadAll();
  } catch (e) {
    toast('Failed to add user', true);
  }
  $('addUserBtn').disabled = false;
}
$('addUserBtn').addEventListener('click', addUser);
['newEmail', 'newName'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') addUser(); }));

$('loginBtn').addEventListener('click', attemptLogin);
$('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') attemptLogin(); });

async function attemptLogin(){
  ADMIN_PASSWORD = $('loginPassword').value;
  try {
    const data = await callAdmin({ action: 'list' });
    STATE.users = data.users || [];
    STATE.tools = data.tools || [];
    STATE.userTools = data.userTools || [];
    render();
    $('loginScreen').style.display = 'none';
    resetSessionTimer();
  } catch (e) {
    ADMIN_PASSWORD = null;
    $('loginError').textContent = 'Incorrect password';
  }
}
</script>

</body>
